# Test Spring DataSource Configuration (H2 In-Memory)
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Google OAuth2 Client Configuration (mocked for testing)
spring.security.oauth2.client.registration.google.client-id=mock-client-id
spring.security.oauth2.client.registration.google.client-secret=mock-client-secret
spring.security.oauth2.client.registration.google.scope=profile,email

report.schedule.cron=0 0 0 * * ?
front.end.url=http://localhost:3000

# Brevo configuration (mocked/stubbed for test context loading)
brevo.api-key=mock-test-brevo-api-key
brevo.sender-email=mock-sender@sentinelcore.com
brevo.sender-name=SentinelCore

# Grok configuration (mocked for test context loading; no real key is committed)
spring.ai.openai.api-key=mock-test-grok-api-key
spring.ai.openai.base-url=https://api.x.ai
spring.ai.openai.chat.options.model=grok-4.5
