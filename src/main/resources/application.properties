spring.application.name=dashboard

# ── Database ────────────────────────────────────────────────────────────────
# Set SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME, SPRING_DATASOURCE_PASSWORD on Render.
spring.datasource.url=${SPRING_DATASOURCE_URL:}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# ── Hibernate / JPA ──────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ── HikariCP — tuned for Neon serverless PostgreSQL ────────────────────────
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.keepalive-time=60000

# ── DevTools (disabled in production) ────────────────────────────────────────
spring.devtools.livereload.enabled=false
spring.devtools.restart.enabled=false

# ── Server ────────────────────────────────────────────────────────────────────
server.port=${PORT:8080}

# ── Session Cookie — cross-site (Vercel frontend ↔ Render backend) ───────────
# CRITICAL: SameSite=None is required for cross-origin cookie storage.
# The browser will REJECT the JSESSIONID on Vercel→Render calls without this.
server.servlet.session.cookie.same-site=none
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.name=JSESSIONID
# Session timeout: 30 minutes of inactivity
server.servlet.session.timeout=30m
# Remember-me cookie also needs cross-site flags (set in SecurityConfig)

# ── Jackson ───────────────────────────────────────────────────────────────────
# Prevent serialization failures on lazy-loaded proxies and empty beans
spring.jackson.serialization.fail-on-empty-beans=false
spring.jackson.default-property-inclusion=non_null
spring.jackson.serialization.write-dates-as-timestamps=false
# ── Brevo Transactional Email (REST API) ─────────────────────────────────────
# Gmail SMTP has been removed. Email is now sent via Brevo HTTPS REST API.
# Set BREVO_API_KEY, BREVO_SENDER_EMAIL, BREVO_SENDER_NAME on Render.
brevo.api-key=${BREVO_API_KEY:}
brevo.sender-email=${BREVO_SENDER_EMAIL:}
brevo.sender-name=${BREVO_SENDER_NAME:SentinelCore}

# ── xAI / Grok AI Assistant ──────────────────────────────────────────────────
# Set XAI_API_KEY on Render. Do NOT commit the actual key to source control.
xai.api-key=${XAI_API_KEY:}
xai.base-url=https://api.x.ai/v1
xai.model=grok-4.5
