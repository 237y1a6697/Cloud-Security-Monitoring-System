<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile — SentinelCore</title>
    <link rel="stylesheet" th:href="@{/css/main.css}">
    <link rel="icon" type="image/svg+xml" th:href="@{/images/logo.svg}">
    <link rel="stylesheet" type="text/css" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
    <style>
        body {
            background: #0f1320;
            font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
            color: #d0d8ee;
            min-height: 100vh;
        }

        .profile-page {
            max-width: 860px;
            margin: 0 auto;
            padding: 32px 16px;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: #6b7fa0;
            text-decoration: none;
            font-size: 0.84rem;
            margin-bottom: 24px;
            transition: color .2s;
        }

        .back-link:hover {
            color: #3a7bd5;
        }

        .card {
            background: rgba(13, 21, 47, 0.85);
            border: 1px solid rgba(30, 90, 200, 0.2);
            border-radius: 16px;
            padding: 28px 32px;
            margin-bottom: 22px;
            backdrop-filter: blur(16px);
        }

        .card-title {
            font-size: 1rem;
            font-weight: 700;
            color: #e8edf8;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.07);
            padding-bottom: 14px;
        }

        /* Avatar */
        .avatar-row {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 22px;
        }

        .avatar-circle {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            background: linear-gradient(135deg, #1e5fc8, #7825dc);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.6rem;
            font-weight: 700;
            color: #fff;
            flex-shrink: 0;
            box-shadow: 0 0 24px rgba(58, 123, 213, 0.4);
        }

        .avatar-info h2 {
            font-size: 1.1rem;
            font-weight: 700;
            color: #e8edf8;
        }

        .role-badge {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 40px;
            font-size: 0.72rem;
            font-weight: 600;
            background: rgba(58, 123, 213, 0.2);
            border: 1px solid rgba(58, 123, 213, 0.4);
            color: #60a5fa;
            margin-top: 5px;
        }

        /* Info grid */
        .info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
        }

        .info-item label {
            display: block;
            font-size: 0.72rem;
            font-weight: 600;
            color: #6b7fa0;
            text-transform: uppercase;
            letter-spacing: .4px;
            margin-bottom: 4px;
        }

        .info-item span {
            font-size: 0.9rem;
            color: #c8d4ee;
        }

        .info-item .na {
            color: #3a4a68;
            font-style: italic;
        }

        /* Form */
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
        }

        .full {
            grid-column: 1/-1;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-label {
            font-size: 0.73rem;
            font-weight: 600;
            color: #8a9bb8;
            text-transform: uppercase;
            letter-spacing: .4px;
            margin-bottom: 6px;
        }

        .form-input {
            padding: 10px 13px;
            background: rgba(255, 255, 255, 0.05);
            border: 1.5px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            color: #e8edf8;
            font-size: 0.9rem;
            outline: none;
            transition: border-color .2s;
        }

        .form-input:focus {
            border-color: #3a7bd5;
            box-shadow: 0 0 0 3px rgba(58, 123, 213, 0.2);
        }

        .alert {
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 0.82rem;
            margin-bottom: 16px;
        }

        .alert-success {
            background: rgba(34, 197, 94, 0.15);
            border: 1px solid rgba(34, 197, 94, 0.3);
            color: #4ade80;
        }

        .alert-danger {
            background: rgba(220, 38, 38, 0.15);
            border: 1px solid rgba(220, 38, 38, 0.35);
            color: #f87171;
        }

        .btn-save {
            padding: 10px 24px;
            background: linear-gradient(135deg, #1e5fc8, #3a7bd5);
            border: none;
            border-radius: 8px;
            color: #fff;
            font-weight: 600;
            cursor: pointer;
            font-size: 0.88rem;
            transition: transform .15s;
            margin-top: 4px;
        }

        .btn-save:hover {
            transform: translateY(-1px);
        }
    </style>
</head>

<body>
    <div class="profile-page">
        <a th:href="@{/dashboard}" class="back-link"><i class="ph ph-arrow-left"></i> Back to Dashboard</a>

        <!-- Flash messages -->
        <div class="alert alert-success" th:if="${success}" th:text="${success}"></div>
        <div class="alert alert-danger" th:if="${pwdError}" th:text="${pwdError}"></div>

        <!-- ── Profile Card ────────────────────────────────────────── -->
        <div class="card">
            <div class="card-title"><i class="ph ph-user-circle"></i> My Profile</div>

            <div class="avatar-row" th:if="${currentUser != null}">
                <div class="avatar-circle" th:text="${currentUser.firstName != null and !currentUser.firstName.isEmpty()} ?
                       ${currentUser.firstName.substring(0,1).toUpperCase()} :
                       ${currentUser.username.substring(0,1).toUpperCase()}"></div>
                <div class="avatar-info">
                    <h2 th:text="${currentUser.displayName}">User Name</h2>
                    <span class="role-badge" th:text="${currentUser.primaryRoleName}">ROLE</span>
                </div>
            </div>

            <div class="info-grid" th:if="${currentUser != null}">
                <div class="info-item">
                    <label>Username</label>
                    <span th:text="${currentUser.username}">—</span>
                </div>
                <div class="info-item">
                    <label>Email</label>
                    <span th:text="${currentUser.email ?: '—'}"
                        th:classappend="${currentUser.email == null} ? 'na'">—</span>
                </div>
                <div class="info-item">
                    <label>Organization</label>
                    <span th:text="${currentUser.organization ?: '—'}"
                        th:classappend="${currentUser.organization == null} ? 'na'">—</span>
                </div>
                <div class="info-item">
                    <label>Phone</label>
                    <span th:text="${currentUser.phone ?: '—'}"
                        th:classappend="${currentUser.phone == null} ? 'na'">—</span>
                </div>
                <div class="info-item">
                    <label>Account Status</label>
                    <span th:text="${currentUser.enabled} ? 'Active' : 'Disabled'"></span>
                </div>
                <div class="info-item">
                    <label>Last Login</label>
                    <span
                        th:text="${currentUser.lastLogin != null} ? ${#temporals.format(currentUser.lastLogin,'dd MMM yyyy HH:mm')} : '—'">—</span>
                </div>
            </div>
        </div>

        <!-- ── Edit Profile ───────────────────────────────────────── -->
        <div class="card">
            <div class="card-title"><i class="ph ph-pencil-simple"></i> Edit Profile</div>
            <form th:action="@{/profile/update}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <div class="form-grid">
                    <div class="form-group">
                        <label class="form-label">First Name</label>
                        <input class="form-input" name="firstName" type="text" th:value="${currentUser?.firstName}">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Last Name</label>
                        <input class="form-input" name="lastName" type="text" th:value="${currentUser?.lastName}">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Email</label>
                        <input class="form-input" name="email" type="email" th:value="${currentUser?.email}">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Phone</label>
                        <input class="form-input" name="phone" type="tel" th:value="${currentUser?.phone}">
                    </div>
                    <div class="form-group full">
                        <label class="form-label">Organization</label>
                        <input class="form-input" name="organization" type="text"
                            th:value="${currentUser?.organization}">
                    </div>
                </div>
                <button type="submit" class="btn-save" style="margin-top:18px;">Save Changes</button>
            </form>
        </div>

        <!-- ── Change Password ────────────────────────────────────── -->
        <div class="card">
            <div class="card-title"><i class="ph ph-lock-key"></i> Change Password</div>
            <form th:action="@{/profile/change-password}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <div class="form-grid">
                    <div class="form-group full">
                        <label class="form-label">Current Password</label>
                        <input class="form-input" name="oldPassword" type="password" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">New Password</label>
                        <input class="form-input" name="newPassword" type="password" required minlength="6">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Confirm New Password</label>
                        <input class="form-input" name="confirmNewPassword" type="password" required>
                    </div>
                </div>
                <button type="submit" class="btn-save"
                    style="margin-top:18px; background: linear-gradient(135deg,#7825dc,#9b5de5);">Update
                    Password</button>
            </form>
        </div>
    </div>
</body>

</html>
