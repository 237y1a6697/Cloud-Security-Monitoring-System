<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IT Asset Monitoring Dashboard</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body{
        background:#f4f6f9;
    }

    .card{
        border:none;
        border-radius:15px;
    }

    .table{
        background:white;
    }

    .header{
        background:#0d6efd;
        color:white;
        padding:20px;
        border-radius:10px;
        margin-bottom:20px;
    }
  </style>
</head>

<body>

<div class="container mt-4">

  <div class="header">
    <h2>IT Asset Monitoring Dashboard</h2>
    <p>Connected to PostgreSQL ✅</p>
  </div>

  <div class="row mb-4">

    <div class="col-md-3">
      <div class="card text-bg-primary">
        <div class="card-body">
          <h5>Total Assets</h5>
          <h2 id="totalAssets">0</h2>
        </div>
      </div>
    </div>

    <div class="col-md-3">
      <div class="card text-bg-success">
        <div class="card-body">
          <h5>Healthy</h5>
          <h2 id="healthyAssets">0</h2>
        </div>
      </div>
    </div>

    <div class="col-md-3">
      <div class="card text-bg-warning">
        <div class="card-body">
          <h5>Warning</h5>
          <h2 id="warningAssets">0</h2>
        </div>
      </div>
    </div>

    <div class="col-md-3">
      <div class="card text-bg-danger">
        <div class="card-body">
          <h5>Critical</h5>
          <h2 id="criticalAssets">0</h2>
        </div>
      </div>
    </div>

  </div>

  <h3>Add Asset</h3>

  <form id="assetForm" class="row g-3">

    <div class="col-md-4">
      <input type="text" id="assetName" class="form-control" placeholder="Asset Name" required>
    </div>

    <div class="col-md-4">
      <input type="text" id="assetType" class="form-control" placeholder="Asset Type" required>
    </div>

    <div class="col-md-4">
      <input type="text" id="status" class="form-control" placeholder="Status (Healthy/Warning/Critical)" required>
    </div>

    <div class="col-md-3">
      <input type="number" id="cpuUsage" class="form-control" placeholder="CPU %" required>
    </div>

    <div class="col-md-3">
      <input type="number" id="memoryUsage" class="form-control" placeholder="Memory %" required>
    </div>

    <div class="col-md-3">
      <input type="number" id="diskUsage" class="form-control" placeholder="Disk %" required>
    </div>

    <div class="col-md-3">
      <input type="number" id="networkUsage" class="form-control" placeholder="Network %" required>
    </div>

    <div class="col-md-6">
      <input type="number" step="0.1" id="uptime" class="form-control" placeholder="Uptime">
    </div>

    <div class="col-md-6">
      <input type="text" id="location" class="form-control" placeholder="Location">
    </div>

    <div class="col-12">
      <button class="btn btn-primary">Save Asset</button>
    </div>

  </form>

  <hr>

  <h3>Asset List</h3>

  <table class="table table-bordered table-hover">

    <thead class="table-dark">
    <tr>
      <th>ID</th>
      <th>Name</th>
      <th>Type</th>
      <th>Status</th>
      <th>CPU</th>
      <th>Memory</th>
      <th>Disk</th>
      <th>Network</th>
      <th>Uptime</th>
      <th>Location</th>
    </tr>
    </thead>

    <tbody id="assetTable">

    </tbody>

  </table>

</div>

<script>

  loadAssets();

  document.getElementById("assetForm").addEventListener("submit",function(e){

  e.preventDefault();

  const asset={

  assetName:assetName.value,
  assetType:assetType.value,
  status:status.value,
  cpuUsage:Number(cpuUsage.value),
  memoryUsage:Number(memoryUsage.value),
  diskUsage:Number(diskUsage.value),
  networkUsage:Number(networkUsage.value),
  uptime:Number(uptime.value),
  location:location.value

  };

  fetch("http://localhost:8081/api/assets",{

  method:"POST",

  headers:{
  "Content-Type":"application/json"
  },

  body:JSON.stringify(asset)

  })

  .then(()=>{

  document.getElementById("assetForm").reset();

  loadAssets();

  });

  });

  function loadAssets(){

  fetch("http://localhost:8081/api/assets")

  .then(res=>res.json())

  .then(data=>{

  let table="";

  let healthy=0;
  let warning=0;
  let critical=0;

  data.forEach(a=>{

  table+=`

  <tr>

  <td>${a.id}</td>

  <td>${a.assetName}</td>

  <td>${a.assetType}</td>

  <td>${a.status}</td>

  <td>${a.cpuUsage}%</td>

  <td>${a.memoryUsage}%</td>

  <td>${a.diskUsage}%</td>

  <td>${a.networkUsage}%</td>

  <td>${a.uptime}</td>

  <td>${a.location}</td>

  </tr>

  `;

  if(a.status=="Healthy") healthy++;
  if(a.status=="Warning") warning++;
  if(a.status=="Critical") critical++;

  });

  document.getElementById("assetTable").innerHTML=table;

  totalAssets.innerHTML=data.length;
  healthyAssets.innerHTML=healthy;
  warningAssets.innerHTML=warning;
  criticalAssets.innerHTML=critical;

  });

  }

</script>

</body>
</html>
