<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register — SentinelCore SecureOps</title>
    <link rel="stylesheet" th:href="@{/css/main.css}">
    <link rel="icon" type="image/svg+xml" th:href="@{/images/logo.svg}">
    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0a0e1a;
            font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
            overflow-x: hidden;
        }

        .bg-canvas {
            position: fixed;
            inset: 0;
            z-index: 0;
            background: radial-gradient(ellipse at 75% 60%, rgba(120, 40, 220, 0.15) 0%, transparent 55%),
                radial-gradient(ellipse at 20% 30%, rgba(30, 90, 200, 0.18) 0%, transparent 60%),
                linear-gradient(135deg, #070b15, #0d1530);
        }

        .bg-grid {
            position: fixed;
            inset: 0;
            z-index: 0;
            background-image: linear-gradient(rgba(30, 90, 200, 0.07) 1px, transparent 1px),
                linear-gradient(90deg, rgba(30, 90, 200, 0.07) 1px, transparent 1px);
            background-size: 48px 48px;
            animation: gridPan 20s linear infinite;
        }

        @keyframes gridPan {
            100% {
                background-position: 48px 48px;
            }
        }

        .auth-card {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 540px;
            background: rgba(13, 21, 47, 0.85);
            border: 1px solid rgba(30, 90, 200, 0.25);
            border-radius: 20px;
            padding: 40px 40px 32px;
            box-shadow: 0 24px 64px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(24px);
            margin: 24px 16px;
            animation: cardIn 0.5s cubic-bezier(.22, 1, .36, 1) both;
        }

        @keyframes cardIn {
            from {
                opacity: 0;
                transform: translateY(24px);
            }
        }

        .brand {
            text-align: center;
            margin-bottom: 28px;
        }

        .brand-logo {
            width: 46px;
            height: 46px;
            margin-bottom: 10px;
            filter: drop-shadow(0 0 12px rgba(58, 134, 255, 0.6));
        }

        .brand h1 {
            font-size: 1.18rem;
            font-weight: 700;
            color: #e8edf8;
        }

        .brand p {
            font-size: 0.76rem;
            color: #6b7fa0;
            margin-top: 3px;
        }

        .alert {
            padding: 11px 14px;
            border-radius: 8px;
            font-size: 0.83rem;
            margin-bottom: 16px;
        }

        .alert-danger {
            background: rgba(220, 38, 38, 0.15);
            border: 1px solid rgba(220, 38, 38, 0.35);
            color: #f87171;
        }

        .alert-success {
            background: rgba(34, 197, 94, 0.15);
            border: 1px solid rgba(34, 197, 94, 0.35);
            color: #4ade80;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
        }

        .full {
            grid-column: 1 / -1;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-label {
            font-size: 0.74rem;
            font-weight: 600;
            color: #8a9bb8;
            text-transform: uppercase;
            letter-spacing: .5px;
            margin-bottom: 6px;
        }

        .form-label .optional {
            font-weight: 400;
            color: #4a5a78;
            text-transform: none;
            letter-spacing: 0;
        }

        .form-input {
            width: 100%;
            padding: 10px 13px;
            font-size: 0.9rem;
            background: rgba(255, 255, 255, 0.05);
            border: 1.5px solid rgba(255, 255, 255, 0.1);
            border-radius: 9px;
            color: #e8edf8;
            outline: none;
            transition: border-color .2s, box-shadow .2s;
        }

        .form-input:focus {
            border-color: #3a7bd5;
            box-shadow: 0 0 0 3px rgba(58, 123, 213, 0.2);
        }

        .form-input::placeholder {
            color: #4a5a78;
        }

        .password-strength {
            height: 3px;
            border-radius: 3px;
            margin-top: 6px;
            background: rgba(255, 255, 255, 0.08);
            overflow: hidden;
        }

        .strength-bar {
            height: 100%;
            width: 0;
            border-radius: 3px;
            transition: width .3s, background .3s;
        }

        .terms-row {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            font-size: 0.82rem;
            color: #8a9bb8;
        }

        .terms-row input {
            accent-color: #3a7bd5;
            width: 16px;
            height: 16px;
            margin-top: 1px;
            flex-shrink: 0;
        }

        .terms-row a {
            color: #3a7bd5;
            text-decoration: none;
        }

        .terms-row a:hover {
            text-decoration: underline;
        }

        .btn-primary {
            width: 100%;
            padding: 12px;
            font-size: 0.95rem;
            font-weight: 600;
            background: linear-gradient(135deg, #1e5fc8, #3a7bd5);
            border: none;
            border-radius: 9px;
            color: #fff;
            cursor: pointer;
            margin-top: 20px;
            box-shadow: 0 4px 18px rgba(58, 123, 213, 0.4);
            transition: transform .15s, box-shadow .15s;
        }

        .btn-primary:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 24px rgba(58, 123, 213, 0.5);
        }

        .role-badge {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 40px;
            font-size: 0.72rem;
            font-weight: 600;
            background: rgba(34, 197, 94, 0.15);
            border: 1px solid rgba(34, 197, 94, 0.3);
            color: #4ade80;
            margin-top: 4px;
        }

        .notice {
            font-size: 0.78rem;
            color: #5a6a88;
            margin-top: 6px;
        }

        .link-row {
            text-align: center;
            font-size: 0.83rem;
            color: #6b7fa0;
            margin-top: 20px;
        }

        .link-row a {
            color: #3a7bd5;
            font-weight: 600;
            text-decoration: none;
        }

        .link-row a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>
    <div class="bg-canvas"></div>
    <div class="bg-grid"></div>

    <div class="auth-card">
        <div class="brand">
            <img th:src="@{/images/logo.svg}" alt="Logo" class="brand-logo">
            <h1>Create Account</h1>
            <p>SentinelCore SecureOps Platform</p>
        </div>

        <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>
        <div class="alert alert-success" th:if="${success}" th:text="${success}"></div>

        <form th:action="@{/register}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

            <div class="form-grid">
                <div class="form-group">
                    <label class="form-label" for="firstName">First Name</label>
                    <input type="text" id="firstName" name="firstName" class="form-input" placeholder="Jane">
                </div>
                <div class="form-group">
                    <label class="form-label" for="lastName">Last Name</label>
                    <input type="text" id="lastName" name="lastName" class="form-input" placeholder="Smith">
                </div>

                <div class="form-group full">
                    <label class="form-label" for="username">Username <span style="color:#e05;">*</span></label>
                    <input type="text" id="username" name="username" class="form-input"
                        placeholder="Choose a unique username" required autocomplete="username">
                </div>

                <div class="form-group full">
                    <label class="form-label" for="email">Email</label>
                    <input type="email" id="email" name="email" class="form-input" placeholder="you@company.com">
                </div>

                <div class="form-group">
                    <label class="form-label" for="password">Password <span style="color:#e05;">*</span></label>
                    <input type="password" id="password" name="password" class="form-input"
                        placeholder="Min. 6 characters" required autocomplete="new-password"
                        oninput="checkStrength(this.value)">
                    <div class="password-strength">
                        <div class="strength-bar" id="strengthBar"></div>
                    </div>
                </div>
                <div class="form-group">
                    <label class="form-label" for="confirmPassword">Confirm Password <span
                            style="color:#e05;">*</span></label>
                    <input type="password" id="confirmPassword" name="confirmPassword" class="form-input"
                        placeholder="Repeat password" required autocomplete="new-password">
                </div>

                <div class="form-group">
                    <label class="form-label" for="phone">Phone <span class="optional">(optional)</span></label>
                    <input type="tel" id="phone" name="phone" class="form-input" placeholder="+1 555 000 0000">
                </div>
                <div class="form-group">
                    <label class="form-label" for="organization">Organization</label>
                    <input type="text" id="organization" name="organization" class="form-input"
                        placeholder="Your company">
                </div>

                <div class="form-group full">
                    <label class="form-label" for="role">Role <span style="color:#e05;">*</span></label>
                    <select id="role" name="role" class="form-input" required>
                        <option value="" disabled selected>Select a role</option>
                        <option value="ROLE_VIEWER">👁 VIEWER (Read-Only)</option>
                        <option value="ROLE_SECURITY_ANALYST">📊 SECURITY ANALYST (Analyze & Report)</option>
                        <option value="ROLE_INCIDENT_RESPONDER">⚙️ INCIDENT RESPONDER (Operate & Respond)</option>
                        <option value="ROLE_AUDITOR">📋 AUDITOR (Compliance & Audit)</option>
                        <option value="ROLE_INFRA_ENGINEER">🔧 INFRA ENGINEER (Infrastructure & DevOps)</option>
                        <option value="ROLE_SOC_MANAGER">🛡️ SOC MANAGER (Security Operations)</option>
                        <option value="ROLE_DEVSECOPS">🚀 DEVSECOPS (DevSecOps Engineer)</option>
                        <option value="ROLE_ADMIN">🛡️ ADMIN (Full Access)</option>
                    </select>
                </div>

                <div class="form-group full">
                    <label class="terms-row">
                        <input type="checkbox" required>
                        I agree to the <a href="#">Terms of Service</a> and <a href="#">Security Policy</a>
                    </label>
                </div>
            </div>

            <button type="submit" class="btn-primary">Create Account</button>
        </form>

        <div class="link-row">Already have an account? <a th:href="@{/login}">Sign in</a></div>
    </div>

    <script>
        function checkStrength(val) {
            const bar = document.getElementById('strengthBar');
            let score = 0;
            if (val.length >= 6) score++;
            if (val.length >= 10) score++;
            if (/[A-Z]/.test(val)) score++;
            if (/[0-9]/.test(val)) score++;
            if (/[^A-Za-z0-9]/.test(val)) score++;
            const colors = ['#ef4444', '#f97316', '#eab308', '#22c55e', '#10b981'];
            const widths = ['20%', '40%', '60%', '80%', '100%'];
            bar.style.width = widths[Math.min(score, 4)] || '0';
            bar.style.background = colors[Math.min(score, 4)] || 'transparent';
        }
    </script>
</body>

</html>
